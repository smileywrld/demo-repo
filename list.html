<h2>HTML Unordered List</h2>
<p>HTML Unordered list uses bullet point to indicate items</p>
<ul>
    <li>List One</li>
    <li>List Two</li>
    <li>List Three</li>
    <li>List Four</li>
    <li>List Five</li>
</ul>

<h2>HTML Ordered List</h2>
<p>HTML Ordered list uses numbers or letter to indicate each items</p>

<ol>
    <li>List One</li>
    <li>List Two</li>
</ol>
